name: Bug report
description: Report a problem.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and Mac chip
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or log (optional)
      description: Remove private content; do not upload recordings or project folders.
